<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BShareDrop | Bordex Technologies</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --p: #00f2ff; --bg: #090a10; --card: #121420; --border: #22263d; --text: #eceff4; }
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 15px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 20px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 10px 30px #0008; }
        h1 { color: var(--p); margin: 0 0 10px; font-size: 22px; }
        .nav-tabs { display: flex; background: #0005; padding: 4px; border-radius: 10px; gap: 4px; margin-bottom: 15px; }
        .nav-btn { flex: 1; padding: 8px; border: none; background: transparent; color: #888; font-weight: bold; cursor: pointer; border-radius: 8px; }
        .nav-btn.active { background: var(--border); color: var(--p); }
        .btn { background: var(--p); color: #000; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; }
        input[type="text"] { width: 100%; padding: 10px; background: #0004; border: 1px solid var(--border); border-radius: 8px; color: #fff; text-align: center; margin-bottom: 8px; }
        #qrcode { background: #fff; padding: 8px; border-radius: 12px; display: inline-block; margin: 10px 0; }
        #chat { height: 90px; overflow-y: auto; background: #0004; border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-size: 12px; text-align: left; margin-bottom: 8px; }
        .progress-bar { height: 6px; background: #222; border-radius: 3px; overflow: hidden; margin: 10px 0; display: none; }
        .progress-fill { height: 100%; width: 0%; background: var(--p); transition: width 0.1s; }
        #download-link { display: none; background: #00ff8822; color: #00ff88; border: 1px solid #00ff88; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 10px; }
        .footer { font-size: 11px; color: #555; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h1>BSHAREDROP</h1>

    <!-- Üst Sayfa / Mod Seçimi -->
    <div class="nav-tabs">
        <button class="nav-btn active" onclick="setMode('single')">Bireysel</button>
        <button class="nav-btn" onclick="setMode('room')">Grup Odası</button>
    </div>

    <!-- Bireysel Mod -->
    <div id="single-panel">
        <div id="qrcode"></div>
        <p style="font-size: 11px; color: #aaa; margin: 0;">ID Kodu: <b id="my-id" style="color:var(--p)">...</b></p>
        <input type="text" id="target-id" placeholder="Cihaz ID Girin" style="margin-top:10px;">
        <button class="btn" onclick="connectSingle()">Bağlan</button>
    </div>

    <!-- Grup Odası Modu -->
    <div id="room-panel" style="display:none;">
        <button class="btn" onclick="createRoom()">Oda Kur</button>
        <p style="font-size:12px; color:#888; margin:8px 0;">veya</p>
        <input type="text" id="room-code-input" placeholder="Oda Kodunu Girin">
        <button class="btn" onclick="joinRoom()">Odaya Katıl</button>
    </div>

    <!-- Transfer & Chat Alanı (Ortak) -->
    <div id="transfer-panel" style="display:none;">
        <p id="room-status" style="font-size:12px; color:var(--p); font-weight:bold;"></p>
        <div id="chat"></div>
        <div style="display:flex; gap:5px;">
            <input type="text" id="chat-msg" placeholder="Mesaj yaz..." style="margin:0;">
            <button class="btn" style="width:auto; margin:0;" onclick="sendChat()">Gönder</button>
        </div>
        
        <input type="file" id="file-input" style="margin-top:10px; font-size:12px;">
        <button class="btn" id="send-file-btn" onclick="sendFile()">Dosyayı Odadakilere Gönder</button>
        
        <div class="progress-bar" id="p-bar-cont"><div class="progress-fill" id="p-fill"></div></div>
        <p style="font-size:11px; color:#aaa;" id="speed-text"></p>
    </div>

    <a id="download-link">📥 Dosyayı İndir</a>
</div>

<div class="footer">© 2026 <b>Bordex Technologies</b></div>

<script>
    const peer = new Peer();
    let conns = []; // Tüm aktif bağlantılar
    let isHost = false;
    let mode = 'single';
    const CHUNK_SIZE = 64 * 1024;

    peer.on('open', id => {
        document.getElementById('my-id').innerText = id;
        new QRCode(document.getElementById("qrcode"), { text: location.href + '?id=' + id, width: 120, height: 120 });
        const autoConnect = new URLSearchParams(location.search).get('id');
        if (autoConnect) { document.getElementById('target-id').value = autoConnect; connectSingle(); }
    });

    peer.on('connection', c => {
        setupConnection(c);
    });

    function setMode(m) {
        mode = m;
        document.querySelectorAll('.nav-btn').forEach((b, i) => b.classList.toggle('active', (i===0 && m==='single') || (i===1 && m==='room')));
        document.getElementById('single-panel').style.display = m === 'single' ? 'block' : 'none';
        document.getElementById('room-panel').style.display = m === 'room' ? 'block' : 'none';
    }

    function connectSingle() {
        const tid = document.getElementById('target-id').value.trim();
        if (tid) setupConnection(peer.connect(tid));
    }

    function createRoom() {
        isHost = true;
        openTransferUI("Oda Kuruldu! Oda Kodu: " + peer.id);
    }

    function joinRoom() {
        const code = document.getElementById('room-code-input').value.trim();
        if (code) {
            setupConnection(peer.connect(code));
            openTransferUI("Odaya Katılındı");
        }
    }

    function setupConnection(c) {
        c.on('open', () => {
            if (!conns.includes(c)) conns.push(c);
            openTransferUI(mode === 'single' ? "Bağlantı Başarılı" : `Oda Aktif (${conns.length} Kişi)`);
            logChat("Sisteme bir cihaz bağlandı.");
        });

        let chunks = [], fileMeta = null;
        c.on('data', data => {
            // Oda kurucusu ise gelen veriyi diğer üyelere dağıtır (Relay)
            if (isHost) broadcast(data, c);

            if (data.type === 'chat') logChat(data.sender + ": " + data.text);
            if (data.type === 'start') { chunks = []; fileMeta = data; document.getElementById('p-bar-cont').style.display = 'block'; }
            if (data.type === 'chunk') { chunks.push(data.chunk); document.getElementById('p-fill').style.width = data.progress + "%"; }
            if (data.type === 'end') {
                const blob = new Blob(chunks);
                const dl = document.getElementById('download-link');
                dl.href = URL.createObjectURL(blob);
                dl.download = fileMeta.name;
                dl.style.display = 'block';
                logChat("Dosya alındı: " + fileMeta.name);
            }
        });

        c.on('close', () => {
            conns = conns.filter(conn => conn !== c);
            logChat("Bir cihaz ayrıldı.");
        });
    }

    function broadcast(data, excludeConn = null) {
        conns.forEach(c => {
            if (c !== excludeConn && c.open) c.send(data);
        });
    }

    function openTransferUI(status) {
        document.getElementById('single-panel').style.display = 'none';
        document.getElementById('room-panel').style.display = 'none';
        document.getElementById('transfer-panel').style.display = 'block';
        document.getElementById('room-status').innerText = status;
    }

    function sendChat() {
        const input = document.getElementById('chat-msg');
        const txt = input.value.trim();
        if (!txt) return;
        const data = { type: 'chat', text: txt, sender: peer.id.substring(0,4) };
        broadcast(data);
        logChat("Sen: " + txt);
        input.value = '';
    }

    async function sendFile() {
        const file = document.getElementById('file-input').files[0];
        if (!file || !conns.length) return;

        broadcast({ type: 'start', name: file.name, size: file.size });
        document.getElementById('p-bar-cont').style.display = 'block';

        let offset = 0;
        while (offset < file.size) {
            const chunk = file.slice(offset, offset + CHUNK_SIZE);
            const buffer = await chunk.arrayBuffer();
            offset += buffer.byteLength;
            const progress = (offset / file.size) * 100;

            broadcast({ type: 'chunk', chunk: buffer, progress: progress });
            document.getElementById('p-fill').style.width = progress + "%";
            await new Promise(r => setTimeout(r, 2)); // Donmayı önleme
        }

        broadcast({ type: 'end' });
        logChat("Dosya Herkese Gönderildi: " + file.name);
    }

    function logChat(msg) {
        const box = document.getElementById('chat');
        box.innerHTML += `<div>• ${msg}</div>`;
        box.scrollTop = box.scrollHeight;
    }
</script>
</body>
</html>
